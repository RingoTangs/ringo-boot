spring:
  application:
    name: ringo-boot-sample
  messages:
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
server:
  port: 8080
ringo:
  boot:
    problem:
      enabled: true
      application-enabled: true
      mvc-enabled: true
      verification-enabled: true
      i18n-enabled: true
      fallback-enabled: true
    verification:
      enabled: true
      store: redis
      length: 6
      ttl: 5m
      max-attempts: 5
      resend-interval: 60s
      redis:
        secret: ${VERIFICATION_HMAC_SECRET}
        expired-retention: 1m
